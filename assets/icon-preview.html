<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude2Strava — App Icon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #161210;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 64px;
      padding: 64px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif;
    }

    /* ── Header ─────────────────────────────────────── */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .eyebrow {
      color: #FC4C02;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    /* ── Main icon display ───────────────────────────── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .rounded {
      border-radius: 22.37%;   /* iOS app icon radius */
      overflow: hidden;
      display: block;
      line-height: 0;
    }

    /* ── Size row ────────────────────────────────────── */
    .size-row {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 36px;
      flex-wrap: wrap;
    }

    .size-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .size-label {
      color: #3d2e28;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    /* ── Light bg preview ───────────────────────────── */
    .contexts {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .ctx {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .ctx-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .bg-light { background: #f4f4f4; padding: 20px; border-radius: 16px; }
    .bg-white  { background: #ffffff; padding: 20px; border-radius: 16px; }

    .ctx.on-light .ctx-label { color: #aaa; }
    .ctx.on-dark  .ctx-label { color: #3d2e28; }

    /* ── Footer ─────────────────────────────────────── */
    footer {
      color: #3a2820;
      font-size: 11px;
      text-align: center;
      line-height: 1.8;
      max-width: 380px;
    }

    footer code {
      color: #FC4C02;
      font-family: "SF Mono", "Fira Mono", monospace;
      font-size: 10px;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: #2a1e18;
    }
  </style>
</head>
<body>

  <header>
    <span class="eyebrow">Claude2Strava · App Icon</span>
  </header>

          <line x1="256" y1="0" x2="256" y2="512"/>

        <circle cx="388" cy="184" r="5.5" fill="#FC4C02" opacity="0.55"/>
        <circle cx="420" cy="166" r="4"   fill="#FC4C02" opacity="0.34"/>
        <circle cx="450" cy="152" r="3"   fill="#FC4C02" opacity="0.18"/>
        <path d="M 388 184 L 420 166 L 450 152" stroke="#FC4C02" stroke-width="1.5" fill="none" opacity="0.14" stroke-linecap="round"/>
        <polyline points="56,452 126,452 148,431 168,473 188,425 208,476 228,452 456,452"
