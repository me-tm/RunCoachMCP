<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}RunCoach MCP{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,.08);
      padding: 2.5rem 2rem;
      max-width: 820px;
      width: 100%;
      text-align: center;
    }
    .connectors-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      margin-top: 1.75rem;
    }
    @media (max-width: 560px) {
      .connectors-grid { grid-template-columns: 1fr; }
    }
    .panel {
      background: #f9f9f9;
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 1.5rem 1.25rem;
      text-align: center;
    }
    .logo { font-size: 2.5rem; margin-bottom: .5rem; }
    h1 { font-size: 1.4rem; font-weight: 700; color: #1a1a1a; margin-bottom: .4rem; }
    p { color: #555; font-size: .95rem; line-height: 1.5; margin-bottom: 1.2rem; }
    .badge {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .35rem .8rem; border-radius: 99px; font-size: .85rem; font-weight: 600;
      margin-bottom: 1.5rem;
    }
    .badge.connected { background: #e6f9f0; color: #1a7a4a; }
    .badge.disconnected { background: #fff0ee; color: #c0392b; }
    .btn {
      display: inline-block; padding: .7rem 1.6rem; border-radius: 8px;
      font-size: .95rem; font-weight: 600; cursor: pointer; border: none;
      text-decoration: none; transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-strava { background: #fc4c02; color: #fff; }
    .btn-garmin { background: #007dc3; color: #fff; }
    .btn-danger { background: #c0392b; color: #fff; font-size: .85rem; padding: .5rem 1rem; }
    .btn-secondary { background: #e8e8e8; color: #333; }
    .section-label { font-size: .7rem; font-weight: 700; text-transform: uppercase;
                     letter-spacing: .08em; color: #aaa; margin-bottom: .75rem; }
    .divider { border: none; border-top: 1px solid #eee; margin: 1.5rem 0; }
    .small { font-size: .8rem; color: #999; }
    .icon-ok { color: #1a7a4a; font-size: 3rem; margin-bottom: .75rem; display: block; }
    .icon-err { color: #c0392b; font-size: 3rem; margin-bottom: .75rem; display: block; }
  </style>
</head>
<body>
  <div class="card">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
