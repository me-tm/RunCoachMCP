<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <title>{% block title %}RunCoach MCP{% endblock %}</title>
  <style>
    :root {
      --bg:        oklch(11%  0.008 250);
      --bg-panel:  oklch(16%  0.011 250);
      --bg-raise:  oklch(20%  0.013 250);
      --border:    oklch(23%  0.014 250);
      --border-sub:oklch(18%  0.010 250);

      --ink:   oklch(93% 0.006 250);
      --ink-2: oklch(60% 0.009 250);
      --ink-3: oklch(38% 0.007 250);

      --strava:    oklch(62% 0.22  30);
      --strava-bg: oklch(20% 0.07  30);
      --garmin:    oklch(57% 0.18 240);
      --garmin-bg: oklch(20% 0.07 240);

      --green:     oklch(67% 0.19 145);
      --green-bg:  oklch(19% 0.07 145);
      --red:       oklch(58% 0.21  25);
      --red-bg:    oklch(20% 0.08  25);

      --r:    10px;
      --r-lg: 14px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Barlow', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.5;
    }

    /* ── Typography ─────────────────────────────────────────── */
    h1 {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 1.9rem;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    p {
      font-size: 0.9rem;
      color: var(--ink-2);
      margin-bottom: 16px;
    }

    .eyebrow {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .small {
      font-size: 0.77rem;
      color: var(--ink-3);
      line-height: 1.55;
    }

    code {
      font-size: 0.72rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      color: var(--ink-2);
      font-family: ui-monospace, 'Cascadia Code', monospace;
    }

    /* ── Single-page wrap (login, callback flows) ────────────── */
    .page-wrap {
      width: 100%;
      max-width: 400px;
      animation: fade-up 0.25s ease-out both;
    }

    .box {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 40px 36px;
      text-align: center;
    }

    /* ── Status indicators ───────────────────────────────────── */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .status__dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status--on  { color: var(--green); }
    .status--on  .status__dot { background: var(--green); box-shadow: 0 0 6px oklch(67% 0.19 145 / 0.55); }
    .status--off { color: var(--ink-3); }
    .status--off .status__dot { background: var(--ink-3); }

    /* ── Buttons ─────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      border-radius: var(--r);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.1s;
      line-height: 1;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { opacity: 0.80; }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn--full { width: 100%; }

    .btn-strava   { background: var(--strava);  color: #fff; }
    .btn-garmin   { background: var(--garmin);  color: #fff; }
    .btn-ghost {
      background: transparent;
      color: var(--ink-2);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { opacity: 1; border-color: oklch(33% 0.016 250); color: var(--ink); }
    .btn-secondary {
      background: var(--bg-raise);
      color: var(--ink-2);
      border: 1px solid var(--border);
    }
    .btn-danger {
      background: transparent;
      color: var(--red);
      border: 1px solid oklch(28% 0.10 25);
      font-size: 0.76rem;
      padding: 7px 14px;
    }
    .btn-danger:hover { opacity: 1; background: var(--red-bg); }

    /* ── Divider ─────────────────────────────────────────────── */
    .divider {
      border: none;
      border-top: 1px solid var(--border-sub);
      margin: 20px 0;
    }

    /* ── Icon states ─────────────────────────────────────────── */
    .icon-ok  { color: var(--green); font-size: 2.2rem; display: block; margin-bottom: 14px; }
    .icon-err { color: var(--red);   font-size: 2.2rem; display: block; margin-bottom: 14px; }

    /* ── Error banner ────────────────────────────────────────── */
    .error-banner {
      background: var(--red-bg);
      border: 1px solid oklch(30% 0.11 25);
      border-radius: var(--r);
      padding: 9px 14px;
      color: var(--red);
      font-size: 0.8rem;
      margin-bottom: 18px;
    }

    /* ── Form elements ───────────────────────────────────────── */
    .form-field   { margin-bottom: 18px; text-align: left; }
    .form-label {
      display: block;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 7px;
    }
    .form-input {
      width: 100%;
      padding: 10px 13px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      font-family: 'Barlow', sans-serif;
      font-size: 0.93rem;
      color: var(--ink);
      outline: none;
      transition: border-color 0.15s;
    }
    .form-input:focus { border-color: oklch(44% 0.022 250); }
    .form-input::placeholder { color: var(--ink-3); }

    /* ── Entrance animation ──────────────────────────────────── */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
